systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m -Dfile.encoding\=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
ksp.incremental=true
# Preserve the existing Kotlin plugin and Android DSL with Backdrop's required AGP 9.
android.builtInKotlin=false
android.newDsl=false

# Release signing is NOT configured here on purpose: a value in this tracked
# file (even a placeholder like "release.keystore") wins over local.properties
# in app/build.gradle.kts' resolveSecret() and makes every release build fail
# with "No release signing key found". Provide the real values via
# local.properties, environment variables or -P flags instead.
#   RELEASE_STORE_FILE=/absolute/path/to/onyx-release.jks
#   RELEASE_STORE_PASSWORD=…
#   RELEASE_KEY_ALIAS=onyx
#   RELEASE_KEY_PASSWORD=…
